<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой плеер</title>
  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --card: #1e1e1e;
      --accent: #7c5cff;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .box {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .cover {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      background: #2a2a2a;
      display: block;
      margin-bottom: 10px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      margin-right: 8px;
      margin-top: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin: 6px 0 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #141414;
      color: var(--text);
    }
    .track-item {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #statusBox, #diagLog {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.9;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #diagLog {
      background: #141414;
      padding: 10px;
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Мой плеер</h2>

  <div class="box">
    <img id="coverImg" class="cover" src="" alt="Обложка" />
    <div id="nowPlaying">Ничего не играет</div>
    <div id="statusBox">Статус: ожидание</div>
    <button id="playPauseBtn" onclick="togglePlay()">Пауза / Играть</button>
    <button onclick="stopTrack()">Стоп</button>
    <audio id="audio" preload="auto"></audio>
  </div>

  <div class="box">
    <h3>Диагностика</h3>
    <div id="diagLog">Лог готов. Нажми ▶ на треке.</div>
  </div>

  <div class="box">
    <h3>Добавить трек (по ID с Google Диска)</h3>
    <input id="titleInput" placeholder="Название трека" />
    <input id="idInput" placeholder="ID файла на Google Диске" />
    <input id="coverInput" placeholder="Ссылка на картинку-обложку (необязательно)" />
    <button onclick="addTrack()">Добавить в список</button>
  </div>

  <div class="box">
    <h3>Плейлист</h3>
    <div id="playlist"></div>
  </div>

  <div class="box">
    <h3>Оформление</h3>
    <label>Цвет фона: <input type="color" id="bgPicker" onchange="applyTheme()" /></label><br/>
    <label>Цвет текста: <input type="color" id="textPicker" onchange="applyTheme()" /></label>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const statusBox = document.getElementById("statusBox");
    const diagLog = document.getElementById("diagLog");
    let tracks = JSON.parse(localStorage.getItem("tracks") || "[]");
    let currentIdx = -1;
    let currentBlobUrl = null;

    function logDiag(msg) {
      const time = new Date().toLocaleTimeString();
      diagLog.textContent += `[${time}] ${msg}\n`;
      diagLog.scrollTop = diagLog.scrollHeight;
    }

    function setStatus(msg) {
      statusBox.innerText = "Статус: " + msg;
    }

    function revokeOldBlob() {
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
    }

    function getCandidateUrls(id) {
      return [
        `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`,
        `https://drive.google.com/uc?export=download&confirm=t&id=${id}`
      ];
    }

    async function fetchAudioBlob(id) {
      const urls = getCandidateUrls(id);
      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        logDiag(`Загрузка потока (${i + 1}/${urls.length}): ${url}`);
        try {
          const res = await fetch(url, {
            headers: {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
            }
          });
          const ct = res.headers.get("content-type") || "";
          logDiag(`Ответ: status=${res.status}, content-type="${ct}"`);
          if (!res.ok) continue;

          const rawBlob = await res.blob();
          logDiag(`Получено байт: ${rawBlob.size}, тип: "${rawBlob.type}"`);

          // Если Google вернул HTML вместо аудио
          if (ct.includes("text/html") || rawBlob.type.includes("text/html")) {
            const snippet = (await rawBlob.text()).slice(0, 140).replace(/\s+/g, " ");
            logDiag(`Пришёл HTML вместо аудио: ${snippet}`);
            continue;
          }

          if (rawBlob.size < 1024) {
            logDiag("Файл слишком маленький, пропускаем...");
            continue;
          }

          // Принудительно задаём audio/mpeg, если сервер отдал application/octet-stream
          const audioBlob = rawBlob.type.startsWith("audio/")
            ? rawBlob
            : new Blob([rawBlob], { type: "audio/mpeg" });

          return audioBlob;
        } catch (err) {
          logDiag(`Ошибка fetch: ${err.message}`);
        }
      }
      return null;
    }

    audio.addEventListener("playing", () => setStatus("играет!"));
    audio.addEventListener("pause", () => {
      if (audio.currentTime > 0 && !audio.ended) setStatus("на паузе");
    });
    audio.addEventListener("ended", () => {
      setStatus("трек завершён");
      // Автопереход к следующему треку в плейлисте
      if (currentIdx + 1 < tracks.length) {
        playByIndex(currentIdx + 1);
      }
    });
    audio.addEventListener("error", () => {
      const err = audio.error;
      logDiag(`audio error: code=${err ? err.code : "?"}, msg=${err ? err.message : ""}`);
      setStatus("ошибка декодирования аудио");
    });

    function saveTracks() {
      localStorage.setItem("tracks", JSON.stringify(tracks));
      renderPlaylist();
    }

    function addTrack() {
      const title = document.getElementById("titleInput").value.trim() || "Без названия";
      const id = document.getElementById("idInput").value.trim();
      const cover = document.getElementById("coverInput").value.trim();
      if (!id) return alert("Вставь ID файла с Google Диска!");
      tracks.push({ title, id, cover });
      document.getElementById("titleInput").value = "";
      document.getElementById("idInput").value = "";
      document.getElementById("coverInput").value = "";
      saveTracks();
    }

    async function playByIndex(idx) {
      const t = tracks[idx];
      if (!t) return;
      currentIdx = idx;
      document.getElementById("nowPlaying").innerText = "Сейчас играет: " + t.title;
      document.getElementById("coverImg").src = t.cover || "";
      setStatus("буферизация с Google Диска...");

      audio.pause();
      revokeOldBlob();

      const blob = await fetchAudioBlob(t.id);
      if (!blob) {
        setStatus("не удалось получить аудиопоток");
        return;
      }

      currentBlobUrl = URL.createObjectURL(blob);
      audio.src = currentBlobUrl;
      audio.load();
      setStatus("запуск...");
      audio.play().catch(e => {
        logDiag("play() rejected: " + e.message);
        setStatus("ошибка запуска: " + e.message);
      });
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play().catch(e => setStatus("ошибка play: " + e.message));
      } else {
        audio.pause();
      }
    }

    function stopTrack() {
      audio.pause();
      audio.currentTime = 0;
      document.getElementById("nowPlaying").innerText = "Остановлено";
      setStatus("остановлено");
    }

    function renderPlaylist() {
      const el = document.getElementById("playlist");
      el.innerHTML = "";
      tracks.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track-item";
        div.innerHTML = `<span>${i + 1}. ${t.title}</span><button onclick="playByIndex(${i})">▶</button>`;
        el.appendChild(div);
      });
    }

    function applyTheme() {
      const bg = document.getElementById("bgPicker").value;
      const text = document.getElementById("textPicker").value;
      document.documentElement.style.setProperty("--bg", bg);
      document.documentElement.style.setProperty("--text", text);
      localStorage.setItem("theme", JSON.stringify({ bg, text }));
    }

    const savedTheme = JSON.parse(localStorage.getItem("theme") || "null");
    if (savedTheme) {
      document.getElementById("bgPicker").value = savedTheme.bg;
      document.getElementById("textPicker").value = savedTheme.text;
      applyTheme();
    } else {
      document.getElementById("bgPicker").value = "#121212";
      document.getElementById("textPicker").value = "#ffffff";
    }

    renderPlaylist();
  </script>
</body>
</html>
