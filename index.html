<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой плеер</title>
  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --card: #1e1e1e;
      --accent: #7c5cff;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .box {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .cover {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      background: #2a2a2a;
      display: block;
      margin-bottom: 10px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      margin-right: 8px;
      margin-top: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin: 6px 0 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #141414;
      color: var(--text);
    }
    .track-item {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #statusBox, #diagLog {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.9;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #diagLog {
      background: #141414;
      padding: 10px;
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Мой плеер</h2>

  <div class="box">
    <img id="coverImg" class="cover" src="" alt="Обложка" />
    <div id="nowPlaying">Ничего не играет</div>
    <div id="statusBox">Статус: ожидание</div>
    <button id="playPauseBtn" onclick="togglePlay()">Пауза / Играть</button>
    <button onclick="stopTrack()">Стоп</button>
    <button onclick="openCurrentInBrowser()">Открыть ссылку в браузере</button>
    <button onclick="runFetchDiag()">Тест заголовков (fetch)</button>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <div class="box">
    <h3>Диагностика</h3>
    <div id="diagLog">Лог пока пуст. Нажми ▶ на треке или запусти тест.</div>
  </div>

  <div class="box">
    <h3>Добавить трек (по ID с Google Диска)</h3>
    <input id="titleInput" placeholder="Название трека" />
    <input id="idInput" placeholder="ID файла на Google Диске" />
    <input id="coverInput" placeholder="Ссылка на картинку-обложку (необязательно)" />
    <button onclick="addTrack()">Добавить в список</button>
  </div>

  <div class="box">
    <h3>Плейлист</h3>
    <div id="playlist"></div>
  </div>

  <div class="box">
    <h3>Оформление</h3>
    <label>Цвет фона: <input type="color" id="bgPicker" onchange="applyTheme()" /></label><br/>
    <label>Цвет текста: <input type="color" id="textPicker" onchange="applyTheme()" /></label>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const statusBox = document.getElementById("statusBox");
    const diagLog = document.getElementById("diagLog");
    let tracks = JSON.parse(localStorage.getItem("tracks") || "[]");
    let currentIdx = -1;
    let triedFallback = false;
    let activeUrl = "";

    function logDiag(msg) {
      const time = new Date().toLocaleTimeString();
      diagLog.textContent += `[${time}] ${msg}\n`;
      diagLog.scrollTop = diagLog.scrollHeight;
    }

    function setStatus(msg) {
      statusBox.innerText = "Статус: " + msg;
    }

    function getCandidateUrls(id) {
      return [
        `https://drive.google.com/uc?export=download&id=${id}`,
        `https://drive.usercontent.google.com/download?id=${id}&export=download`
      ];
    }

    audio.addEventListener("loadstart", () => {
      setStatus("загрузка потока...");
      logDiag("event: loadstart -> " + audio.currentSrc);
    });
    audio.addEventListener("loadedmetadata", () => {
      logDiag("event: loadedmetadata, duration=" + audio.duration);
    });
    audio.addEventListener("canplay", () => {
      setStatus("готово к воспроизведению");
      logDiag("event: canplay");
    });
    audio.addEventListener("playing", () => {
      setStatus("играет");
      logDiag("event: playing");
    });
    audio.addEventListener("pause", () => {
      if (audio.currentTime > 0) setStatus("на паузе");
      logDiag("event: pause");
    });
    audio.addEventListener("error", () => {
      const err = audio.error;
      const code = err ? err.code : "?";
      const msg = err && err.message ? err.message : "";
      logDiag(`event: error (code=${code}, msg=${msg}, src=${audio.src})`);

      const t = tracks[currentIdx];
      if (t && !triedFallback) {
        triedFallback = true;
        const fallbackUrl = getCandidateUrls(t.id)[1];
        activeUrl = fallbackUrl;
        setStatus("пробую альтернативную ссылку...");
        logDiag("fallback -> " + fallbackUrl);
        audio.src = fallbackUrl;
        audio.load();
        audio.play().catch(e => {
          setStatus("ошибка альтернативной ссылки: " + e.message);
          logDiag("fallback play() rejected: " + e.message);
        });
        return;
      }
      setStatus("ошибка воспроизведения (код " + code + ")");
    });

    function saveTracks() {
      localStorage.setItem("tracks", JSON.stringify(tracks));
      renderPlaylist();
    }

    function addTrack() {
      const title = document.getElementById("titleInput").value.trim() || "Без названия";
      const id = document.getElementById("idInput").value.trim();
      const cover = document.getElementById("coverInput").value.trim();
      if (!id) return alert("Вставь ID файла с Google Диска!");
      tracks.push({ title, id, cover });
      document.getElementById("titleInput").value = "";
      document.getElementById("idInput").value = "";
      document.getElementById("coverInput").value = "";
      saveTracks();
    }

    function playByIndex(idx) {
      const t = tracks[idx];
      if (!t) return;
      currentIdx = idx;
      triedFallback = false;
      activeUrl = getCandidateUrls(t.id)[0];
      audio.src = activeUrl;
      audio.load();
      document.getElementById("nowPlaying").innerText = "Сейчас играет: " + t.title;
      document.getElementById("coverImg").src = t.cover || "";
      setStatus("запуск...");
      logDiag(`playByIndex(${idx}) id="${t.id}" -> ${activeUrl}`);
      audio.play().catch(e => {
        logDiag("initial play() rejected: " + e.message);
      });
    }

    function openCurrentInBrowser() {
      const t = tracks[currentIdx] || tracks[0];
      if (!t) return alert("Сначала добавь трек в плейлист");
      const url = activeUrl || getCandidateUrls(t.id)[1];
      window.open(url, "_blank");
    }

    async function runFetchDiag() {
      const t = tracks[currentIdx] || tracks[0];
      if (!t) {
        logDiag("fetch test: нет треков в плейлисте");
        return;
      }
      const url = getCandidateUrls(t.id)[1];
      logDiag("fetch test start: " + url);
      try {
        const res = await fetch(url);
        const ct = res.headers.get("content-type");
        const cd = res.headers.get("content-disposition");
        const cl = res.headers.get("content-length");
        logDiag(`fetch ok: status=${res.status}, redirected=${res.redirected}, finalUrl=${res.url}`);
        logDiag(`headers: content-type="${ct}", content-disposition="${cd}", content-length="${cl}"`);
      } catch (err) {
        logDiag("fetch failed: " + err.name + ": " + err.message);
      }
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play().catch(e => setStatus("ошибка play: " + e.message));
      } else {
        audio.pause();
      }
    }

    function stopTrack() {
      audio.pause();
      audio.currentTime = 0;
      document.getElementById("nowPlaying").innerText = "Остановлено";
      setStatus("остановлено");
    }

    function renderPlaylist() {
      const el = document.getElementById("playlist");
      el.innerHTML = "";
      tracks.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track-item";
        div.innerHTML = `<span>${i + 1}. ${t.title}</span><button onclick="playByIndex(${i})">▶</button>`;
        el.appendChild(div);
      });
    }

    function applyTheme() {
      const bg = document.getElementById("bgPicker").value;
      const text = document.getElementById("textPicker").value;
      document.documentElement.style.setProperty("--bg", bg);
      document.documentElement.style.setProperty("--text", text);
      localStorage.setItem("theme", JSON.stringify({ bg, text }));
    }

    const savedTheme = JSON.parse(localStorage.getItem("theme") || "null");
    if (savedTheme) {
      document.getElementById("bgPicker").value = savedTheme.bg;
      document.getElementById("textPicker").value = savedTheme.text;
      applyTheme();
    } else {
      document.getElementById("bgPicker").value = "#121212";
      document.getElementById("textPicker").value = "#ffffff";
    }

    renderPlaylist();
  </script>
</body>
</html>
